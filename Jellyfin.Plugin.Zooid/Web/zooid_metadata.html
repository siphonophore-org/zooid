<!-- zooid_metadata.html -->
<!-- The Metadata tool: the metadata sync table, its counts, and the details of one item. -->

<div id="ZooidMetadataPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/zooid_metadata.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="fieldDescription" data-str="DescSyncMetadata">Item metadata and images, copied onto local items matched by file path.</div>
                <div id="syncStatus" class="stolon-status-text zooid-sync-status" role="status"></div>

                <!-- Status summary cards -->
                <div id="metadataSyncStatusSummary">
                    <div class="stolon-cards" id="metadataStatusRow">
                        <div class="stolon-card stolon-green" id="metadataStatusGroupSynced" title="">
                            <span class="stolon-card-count" id="metadataSyncedCount">0</span>
                            <span class="stolon-card-label" data-str="StatusSynced">Synced</span>
                        </div>
                        <div class="stolon-card stolon-orange" id="metadataStatusGroupQueued" title="">
                            <span class="stolon-card-count" id="metadataQueuedCount">0</span>
                            <span class="stolon-card-label" data-str="StatusQueued">Queued</span>
                        </div>
                        <div class="stolon-card stolon-red" id="metadataStatusGroupErrored" title="">
                            <span class="stolon-card-count" id="metadataErroredCount">0</span>
                            <span class="stolon-card-label" data-str="StatusErrored">Errored</span>
                        </div>
                        <div class="stolon-card stolon-gray" id="metadataStatusGroupIgnored" title="">
                            <span class="stolon-card-count" id="metadataIgnoredCount">0</span>
                            <span class="stolon-card-label" data-str="StatusIgnored">Ignored</span>
                        </div>
                    </div>
                </div>

                <!-- Health dashboard -->
                <div id="metadataHealthDashboard" class="zooid-health-dashboard">
                    <div class="zooid-health-row">
                        <div class="zooid-health-card">
                            <span class="zooid-health-label" data-str="LabelLastSync">Last sync</span>
                            <span class="zooid-health-value" id="metadataHealthLastSync" data-str="Never">Never</span>
                        </div>
                        <div class="zooid-health-card">
                            <span class="zooid-health-label" data-str="LabelLibrariesMapped">Libraries mapped</span>
                            <span class="zooid-health-value" id="metadataHealthLibraryCount">0</span>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="stolon-button-row">
                    <button is="emby-button" type="button" id="btnRefreshMetadataItems" class="raised stolon-button stolon-secondary stolon-fill">
                        <span data-str="Refresh">Refresh</span>
                    </button>
                    <button is="emby-button" type="button" id="btnTriggerMetadataSync" class="raised stolon-button stolon-primary stolon-fill">
                        <span data-str="TabSync">Sync</span>
                    </button>
                    <button is="emby-button" type="button" id="btnRetryMetadataErrors" class="raised stolon-button stolon-primary stolon-fill stolon-hidden">
                        <span data-str="ButtonRetryErrors">Retry errors</span>
                    </button>
                </div>

                <div class="stolon-divider stolon-divider-plain"></div>

                <!-- Table -->
                <div id="metadataSyncItemsTableContainer">
                    <!-- The table builds its own markup here. -->
                </div>

                <!-- Metadata Item Detail Sidecar -->
                <div id="metadataSyncItemDetailModal" class="stolon-dialog stolon-sidecar stolon-hidden">
                    <div class="stolon-dialog-content stolon-sidecar-panel stolon-large" role="dialog" aria-modal="true" aria-labelledby="metadataSyncModalTitle">
                        <div class="stolon-sidecar-head">
                            <div class="stolon-sidecar-heading"><div class="stolon-sidecar-title-row"><h2 id="metadataSyncModalTitle" class="stolon-sidecar-title"></h2></div></div>
                            <button type="button" id="btnMetadataSyncModalClose" class="stolon-row-btn stolon-dialog-close" title="Close" data-str-title="ButtonClose" aria-label="Close" data-str-label="ButtonClose"><span class="material-icons" aria-hidden="true">close</span></button>
                        </div>
                        <div class="stolon-sidecar-body">
                            <div class="zooid-modal-top-row">
                                <span id="metadataSyncModalStatusBadge" class="stolon-table-status-badge"></span>
                                <span id="metadataSyncModalServerMapping" class="zooid-modal-server-mapping"></span>
                            </div>
                            <div id="metadataSyncModalInfoGrid" class="zooid-modal-info-grid">
                                <div class="zooid-modal-info-item">
                                    <div class="zooid-modal-info-label" data-str="LabelLastSync">Last sync</div>
                                    <div id="metadataSyncModalLastSync" class="zooid-modal-info-value">-</div>
                                </div>
                                <div class="zooid-modal-info-item">
                                    <div class="zooid-modal-info-label" data-str="ColumnLastEdited">Last edited</div>
                                    <div id="metadataSyncModalVersion" class="zooid-modal-info-value">-</div>
                                </div>
                                <div class="zooid-modal-info-item">
                                    <div class="zooid-modal-info-label" data-str="TasksLibraryCategory">Library</div>
                                    <div id="metadataSyncModalLibrary" class="zooid-modal-info-value">-</div>
                                </div>
                            </div>
                            <div id="metadataSyncModalErrorSection" class="stolon-modal-field stolon-hidden">
                                <div class="stolon-modal-field-label" data-str="HeaderError">Error</div>
                                <div id="metadataSyncModalError" class="stolon-error-message"></div>
                            </div>
                            <div id="metadataSyncModalChangesSummary" class="zooid-modal-changes-summary"></div>
                            <div class="zooid-modal-paths-section">
                                <div class="zooid-modal-path-row">
                                    <div class="zooid-modal-path-block">
                                        <div class="zooid-modal-path-label" data-str="LabelSourceFile">Source file</div>
                                        <div id="metadataSyncModalSourcePath" class="zooid-modal-path-value"></div>
                                    </div>
                                    <div class="zooid-modal-path-block">
                                        <div class="zooid-modal-path-label" data-str="LabelLocalFile">Local file</div>
                                        <div id="metadataSyncModalLocalPath" class="zooid-modal-path-value"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="zooid-modal-table-container">
                                <table class="zooid-compare-table">
                                    <thead>
                                        <tr>
                                            <th class="zooid-compare-table-property" data-str="ColumnProperty">Property</th>
                                            <th id="metadataSyncModalSourceHeader" class="zooid-compare-table-server" data-str="LabelSource">Source</th>
                                            <th id="metadataSyncModalLocalHeader" class="zooid-compare-table-server" data-str="ServerLocal">Local</th>
                                            <th class="zooid-compare-table-merged" data-str="ColumnAfterSync">After sync</th>
                                        </tr>
                                    </thead>
                                    <tbody id="metadataSyncModalTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="stolon-sidecar-shelf">
                            <button is="emby-button" type="button" id="btnMetadataSyncModalIgnore" class="raised stolon-button stolon-secondary stolon-modal-button">
                                <span data-str="ButtonIgnore">Ignore</span>
                            </button>
                            <button is="emby-button" type="button" id="btnMetadataSyncModalQueue" class="raised stolon-button stolon-primary stolon-modal-button">
                                <span data-str="ButtonQueue">Queue</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=zooid_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=zooid_shared.css">

</div>
