name: '🧪 Release Unstable'

# Publishes the unstable branch as a pre-release, which only the Siphonophore unstable manifest lists. It runs
# every Friday, and by hand from the Actions tab on any day. The version is the Jellyfin version followed by
# the date, 12.4.YYYY.MMDD, such as 12.4.2026.1124, so each unstable build sorts after every stable release
# and after the builds before it. The date is today in Denver unless the run names one. A scheduled run skips
# when the newest pre-release already holds the unstable branch's last commit. Releases are immutable once
# published, so the zip goes into a draft that is published after, and a date that already has a release is
# refused. A draft left by a failed run is filled and published.

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Build date as YYYY-MM-DD. Empty is today in Denver.'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

concurrency:
  group: release-unstable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.build_info.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: unstable
          fetch-depth: 0

      - name: Get Build Info
        id: build_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DAY="${DATE_INPUT:-$(TZ=America/Denver date +%Y-%m-%d)}"
          if ! [[ "$DAY" =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
            echo "::error::The date must be YYYY-MM-DD, not '${DAY}'."
            exit 1
          fi
          YEAR="${BASH_REMATCH[1]}"
          MMDD=$((10#${BASH_REMATCH[2]}${BASH_REMATCH[3]}))
          BASE=$(grep '^version:' build.yaml | sed 's/version: *"\?\([^"]*\)"\?.*/\1/' | tr -d '"' | cut -d. -f1-2)
          VERSION="${BASE}.${YEAR}.${MMDD}"
          TAG="v${VERSION}"
          HEAD=$(git rev-parse HEAD)

          LATEST=$(gh release list --limit 50 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease)][0].tagName // ""')
          if [ "$EVENT" = "schedule" ] && [ -n "$LATEST" ] && [ "$(git rev-list -n 1 "$LATEST" 2>/dev/null || true)" = "$HEAD" ]; then
            echo "::notice::${LATEST} already holds ${HEAD}, so this week has nothing new to release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATE=$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "missing")
          if [ "$STATE" = "published" ]; then
            echo "::error::${TAG} is already released, and a published release cannot change. Pick another date."
            exit 1
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "day=${DAY}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} from ${HEAD}."

      - name: Setup .NET
        if: steps.build_info.outputs.skipped != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      # build.sh reads the version from build.yaml, so the date version is written there for this build only.
      - name: Set Version
        if: steps.build_info.outputs.skipped != 'true'
        env:
          VERSION: ${{ steps.build_info.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: \"${VERSION}\"/" build.yaml
          grep '^version:' build.yaml

      - name: Build Plugin
        if: steps.build_info.outputs.skipped != 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Write Notes
        if: steps.build_info.outputs.skipped != 'true'
        env:
          DAY: ${{ steps.build_info.outputs.day }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "Unstable build of ${DAY}, from \`$(git rev-parse --short HEAD)\` on the unstable branch."
            echo
            echo "## Changes"
            LATEST=$(gh release list --limit 50 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease)][0].tagName // ""' || true)
            if [ -n "$LATEST" ] && git rev-parse -q --verify "$LATEST" >/dev/null; then
              git log --no-merges --format='- %s' "${LATEST}..HEAD"
            else
              git log --no-merges --format='- %s' -n 30
            fi
          } > /tmp/notes.md

      - name: Publish Pre-release
        if: steps.build_info.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build_info.outputs.tag }}
          VERSION: ${{ steps.build_info.outputs.version }}
          STATE: ${{ steps.build_info.outputs.state }}
        run: |
          set -euo pipefail
          if [ "$STATE" = "draft" ]; then
            gh release edit "${TAG}" --prerelease --target "$(git rev-parse HEAD)" --notes-file /tmp/notes.md
          else
            gh release create "${TAG}" --draft --prerelease --target "$(git rev-parse HEAD)" --title "${TAG}" --notes-file /tmp/notes.md
          fi
          gh release upload "${TAG}" "dist/zooid-${VERSION}.zip" "dist/zooid-${VERSION}.zip.md5" --clobber
          gh release edit "${TAG}" --draft=false

  # A release made with this run's own token starts no other workflow, so the publish run is called here.
  publish:
    needs: release
    if: needs.release.outputs.skipped != 'true'
    uses: ./.github/workflows/publish.yaml
    secrets:
      SIPHONOPHORE_DISPATCH_TOKEN: ${{ secrets.SIPHONOPHORE_DISPATCH_TOKEN }}
