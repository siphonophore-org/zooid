name: '🧪 Test Plugin'

# Runs the C# tests and the page tests on every change to main and unstable, and on pull requests to them. The page
# tests run against the Stolon release the project references, checked out beside the plugin and bundled.

on:
  push:
    branches:
      - main
      - unstable
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - unstable
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Find the Stolon version
        id: stolon
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*PackageReference Include="Siphonophore.Stolon" Version="\([^"]*\)".*/\1/p' Jellyfin.Plugin.Zooid/Jellyfin.Plugin.Zooid.csproj)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout Stolon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: siphonophore-org/stolon
          ref: v${{ steps.stolon.outputs.version }}
          path: stolon

      - name: Bundle Stolon
        working-directory: stolon
        run: bash scripts/bundle.sh

      - name: Test C#
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet test Jellyfin.Plugin.Zooid.Tests/Jellyfin.Plugin.Zooid.Tests.csproj -c Release

      - name: Test the pages
        env:
          STOLON_ROOT: ${{ github.workspace }}/stolon
        run: node --test --test-timeout=20000 Jellyfin.Plugin.Zooid.Tests/js/*.test.mjs
